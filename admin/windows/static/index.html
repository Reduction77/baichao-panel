<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>白潮 · 本地管理后台</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body>
<aside><a class="brand" href="/">W<span>白潮<small>WIKI STUDIO</small></span></a><div class="nav-caption">内容管理</div><nav><button data-tab="videos" class="active">▤ 配队与视频 <span id="count-videos"></span></button><button data-tab="recommendations">✦ 推荐组合 <span id="count-recommendations"></span></button><button data-tab="sources">↗ 攻略来源 <span id="count-sources"></span></button><button data-tab="matrix">◈ 矩阵次数</button><button data-tab="settings">⚙ 连接设置</button></nav><div class="sidebar-foot"><span class="dot"></span>仅在这台电脑运行<p>草稿保存在本机<br>点击发布后才更新公开 Wiki</p><a href="https://wiki.winboard.top/" target="_blank" rel="noopener noreferrer">查看公开 Wiki ↗</a></div></aside>
<div class="app"><header><div class="breadcrumb">白潮 / 内容工作台</div><div class="header-actions"><button id="logout" hidden>退出登录</button><button id="export">导出备份</button><button id="import">导入备份</button><input id="import-file" type="file" accept=".json,application/json" hidden><button id="pull">从 GitHub 同步</button></div></header><main>
<div class="page-head"><div><p class="eyebrow">LOCAL CONTENT WORKSPACE</p><h1 id="page-title">配队与视频</h1><p id="page-description">管理队伍、配置要求与实战演示。</p></div><button id="add" class="primary">＋ 新建配队</button></div>
<div id="connection" class="status-strip"></div><div id="notice" role="status" aria-live="polite"></div><div id="content"></div>
</main><footer class="publish-bar"><div><strong id="draft-status">正在读取草稿…</strong><small id="publish-status">修改不会直接影响公开网站</small></div><div><button id="save">保存本地草稿</button><button id="preview" class="primary">预览并发布 →</button></div></footer></div>
<dialog id="editor"><form id="edit-form"><div class="dialog-head"><h2 id="editor-title"></h2><button type="button" data-close="editor" aria-label="关闭">×</button></div><div id="editor-fields"></div><p id="editor-error" class="error" role="alert"></p><div class="dialog-actions"><button type="button" data-close="editor">取消</button><button type="submit" class="primary">保存到草稿</button></div></form></dialog>
<dialog id="preview-dialog"><div class="dialog-head"><div><p class="eyebrow">REVIEW CHANGES</p><h2>发布前预览</h2></div><button data-close="preview-dialog" aria-label="关闭">×</button></div><p>以下资料将提交到 GitHub。网站会在自动检查和部署成功后更新。</p><div id="diff"></div><p id="preview-error" class="error" role="alert"></p><div class="dialog-actions"><button data-close="preview-dialog">继续编辑</button><button id="publish" class="primary">确认提交到 GitHub</button></div></dialog>
</body></html>
