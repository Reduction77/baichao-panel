name: baichao-panel
services:
  panel:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8765:8080"
    volumes:
      - panel-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "3"
volumes:
  panel-data:
